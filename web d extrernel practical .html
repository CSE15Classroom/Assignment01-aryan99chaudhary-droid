<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Gallery Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        header {
            background: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }

        nav a {
            color: white;
            margin: 0 10px;
            text-decoration: none;
        }

        nav a:hover {
            text-decoration: underline;
        }

        section {
            padding: 20px;
        }

        /* Gallery grid */
        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
        }

        .gallery img {
            width: 100%;
            border-radius: 8px;
            transition: transform 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.05);
        }

        /* Responsive media queries */
        @media (max-width: 768px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <header>
        <h1>My Responsive Gallery</h1>
        <nav>
            <a href="#home">Home</a>
            <a href="#gallery">Gallery</a>
        </nav>
    </header>

    <!-- Home Section -->
    <section id="home">
        <h2>Welcome</h2>
        <p>This is the homepage. Scroll down or click <strong>Gallery</strong> to see my work!</p>
    </section>

    <!-- Gallery Section -->
    <section id="gallery">
        <h2>Gallery</h2>
        <div class="gallery">
            <div><img src="https://via.placeholder.com/300" alt="Sample 1"></div>
            <div><img src="https://via.placeholder.com/300" alt="Sample 2"></div>
            <div><img src="https://via.placeholder.com/300" alt="Sample 3"></div>
            <div><img src="https://via.placeholder.com/300" alt="Sample 4"></div>
            <div><img src="https://via.placeholder.com/300" alt="Sample 5"></div>
            <div><img src="https://via.placeholder.com/300" alt="Sample 6"></div>
        </div>
    </section>
</body>

</html>
